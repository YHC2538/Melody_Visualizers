<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Melody Visualizers Final v25</title>
    <link href="https://fonts.googleapis.com/css2?family=Comic+Neue:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>

    <style>
        /* --- 全局樣式 --- */
        body {
            margin: 0;
            padding: 0;
            font-family: "Microsoft JhengHei", "Comic Neue", sans-serif;
            background-color: #f0f0f0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        /* 動態背景 Canvas */
        #bg-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            pointer-events: none;
        }

        .app-container {
            width: 90vw;
            height: 85vh;
            background-color: rgba(255, 255, 255, 0.8);
            border: 3px solid #333;
            border-radius: 15px;
            position: relative;
            box-shadow: 15px 15px 0px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            z-index: 1;
            backdrop-filter: blur(3px);
        }

        /* --- 按鈕與輸入框 --- */
        button {
            cursor: pointer;
            border: 2px solid #333;
            background: #fff;
            font-weight: bold;
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 16px;
            transition: all 0.2s;
            font-family: inherit;
        }

        button:hover {
            background-color: #eee;
            transform: translateY(-2px);
            box-shadow: 2px 2px 0 #333;
        }

        button:active {
            transform: translateY(0);
            box-shadow: none;
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .sketch-input,
        .sketch-select {
            width: 100%;
            padding: 8px;
            border: 2px solid #333;
            border-radius: 5px;
            background-color: #fff;
            font-family: inherit;
            font-size: 14px;
            box-sizing: border-box;
            margin-bottom: 5px;
        }

        .sketch-input:focus,
        .sketch-select:focus {
            outline: none;
            background-color: #fafafa;
            border-color: #000;
        }

        label {
            display: block;
            margin-top: 10px;
            margin-bottom: 2px;
            font-weight: bold;
            font-size: 14px;
            color: #333;
        }

        /* --- 畫面切換 --- */
        .screen {
            display: none;
            width: 100%;
            height: 100%;
            flex-direction: column;
        }

        .screen.active {
            display: flex;
        }

        /* --- 1. 開始畫面 --- */
        #start-screen {
            justify-content: center;
            align-items: center;
            gap: 40px;
            background-image: url('musical_bg.png');
            background-size: cover;
            background-position: center;
            background-color: rgba(255, 255, 255, 0.3);
            background-blend-mode: overlay;
        }

        .title {
            font-size: 48px;
            margin-bottom: 20px;
            font-family: 'Comic Sans MS', 'Chalkboard SE', sans-serif;
        }

        .start-menu {
            display: flex;
            flex-direction: row;
            gap: 50px;
            align-items: flex-start;
        }

        .mode-block {
            background: #fff;
            padding: 20px;
            border: 2px dashed #333;
            border-radius: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            min-width: 200px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }

        .action-btn {
            width: 100%;
            padding: 12px;
            background-color: #ddd;
        }

        .action-btn.practice {
            background-color: #d4edda;
        }

        .action-btn.test {
            background-color: #f8d7da;
        }

        /* --- 2. 主要生成畫面 (練功) --- */
        #main-screen {
            flex-direction: row;
            overflow: hidden;
            background-color: transparent;
        }

        .sidebar {
            width: 280px;
            background-color: rgba(249, 249, 249, 0.95);
            border-right: 2px solid #333;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 5px;
            transition: all 0.3s ease;
            white-space: nowrap;
            overflow-y: auto;
            overflow-x: hidden;
        }

        .sidebar.closed {
            width: 0px;
            padding: 0;
            border: none;
            opacity: 0;
        }

        .checkbox-group {
            margin-top: 10px;
            border: 2px dashed #ccc;
            padding: 10px;
            border-radius: 5px;
        }

        .checkbox-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 5px;
        }

        .checkbox-row label {
            margin: 0;
            cursor: pointer;
            font-weight: normal;
        }

        input[type="checkbox"] {
            accent-color: #333;
            width: 18px;
            height: 18px;
            cursor: pointer;
        }

        .generate-btn {
            margin-top: 20px;
            background-color: #eee;
            border: 2px solid #333;
            padding: 12px;
            font-size: 16px;
        }

        .generate-btn:hover {
            background-color: #ccc;
        }

        .main-content {
            flex: 1;
            padding: 20px;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: transparent;
        }

        #open-sidebar-btn {
            display: none;
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 5;
            box-shadow: 2px 2px 5px rgba(0, 0, 0, 0.1);
        }

        .canvas-placeholder {
            width: 80%;
            height: 80%;
            border: 2px solid #eee;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #ccc;
            font-size: 24px;
            background-color: #fff;
            border: 3px dashed #ccc;
        }

        .instruction-btn {
            position: absolute;
            bottom: 20px;
            right: 20px;
        }

        /* --- 3. 測驗畫面 --- */
        #test-screen {
            background-color: transparent;
            justify-content: center;
            align-items: center;
        }

        .test-content {
            text-align: center;
            width: 90%;
            max-width: 800px;
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: rgba(255, 250, 240, 0.6);
            padding: 20px;
            border-radius: 15px;
        }

        #timer-display {
            font-size: 48px;
            font-weight: bold;
            color: #ff6b6b;
            font-family: 'Comic Sans MS', sans-serif;
            margin: 5px 0;
            text-shadow: 2px 2px 0px #333;
        }

        .question-indicator {
            font-size: 20px;
            font-weight: bold;
            color: #333;
            margin-bottom: 5px;
        }

        #live-score {
            font-size: 24px;
            font-weight: bold;
            color: #28a745;
            font-family: 'Comic Sans MS', sans-serif;
            margin-bottom: 10px;
            border: 2px dashed #28a745;
            padding: 5px 15px;
            border-radius: 10px;
            background: #fff;
        }

        #test-info-display {
            font-size: 28px;
            font-family: 'Comic Sans MS', 'Chalkboard SE', sans-serif;
            font-weight: bold;
            margin-bottom: 5px;
            min-height: 40px;
        }

        #transition-display {
            font-size: 20px;
            color: #666;
            font-weight: bold;
            height: 30px;
            margin-bottom: 10px;
        }

        .feedback-correct {
            color: #28a745;
            text-shadow: 1px 1px 0 #000;
        }

        .feedback-wrong {
            color: #dc3545;
            text-shadow: 1px 1px 0 #000;
        }

        .feedback-neutral {
            color: #555;
        }

        /* --- 平面鋼琴鍵盤 CSS --- */
        .piano-container {
            position: relative;
            display: flex;
            justify-content: center;
            margin: 20px 0;
            background: #333;
            padding: 10px 10px 0 10px;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        .key {
            position: relative;
            cursor: pointer;
            border-radius: 0 0 5px 5px;
            user-select: none;
            transition: background-color 0.1s, transform 0.1s;
        }

        .key.white {
            width: 50px;
            height: 180px;
            background: white;
            border: 1px solid #ccc;
            border-top: none;
            z-index: 1;
            margin: 0 2px;
        }

        /* 白鍵按壓效果 (平面) */
        .key.white:active,
        .key.white.active-visual {
            background: #eee;
            transform: translateY(2px);
        }

        .key.black {
            width: 34px;
            height: 110px;
            background: #333;
            position: absolute;
            top: 0;
            z-index: 2;
            border-radius: 0 0 5px 5px;
        }

        /* 黑鍵按壓效果 (平面) */
        .key.black:active,
        .key.black.active-visual {
            background: #000;
        }

        .key.correct {
            background-color: #4caf50 !important;
            box-shadow: 0 0 10px #4caf50;
        }

        .key.wrong {
            background-color: #f44336 !important;
        }

        .piano-container.disabled {
            pointer-events: none;
        }

        .test-controls {
            display: flex;
            gap: 20px;
            margin-top: 20px;
        }

        .play-sound-btn {
            background-color: #333;
            color: white;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            margin-bottom: 10px;
            box-shadow: 2px 2px 5px rgba(0, 0, 0, 0.3);
            transition: transform 0.1s;
        }

        .play-sound-btn:active {
            transform: scale(0.95);
        }

        /* Loading & Modals */
        #loading-screen {
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        .progress-container {
            width: 50%;
            height: 30px;
            border: 3px solid #333;
            border-radius: 15px;
            overflow: hidden;
            background: #fff;
            margin: 20px auto;
        }

        .progress-bar {
            height: 100%;
            width: 0%;
            background-color: #333;
            transition: width 0.1s;
        }

        #instruction-modal,
        #result-modal {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            justify-content: center;
            align-items: center;
            z-index: 10;
        }

        .modal-content {
            width: 60%;
            height: 60%;
            background-color: #fff;
            border: 3px solid #333;
            border-radius: 10px;
            padding: 30px;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .close-btn {
            position: absolute;
            top: 15px;
            right: 15px;
            background: #ff6b6b;
            color: white;
            border: none;
        }

        #result-score {
            font-size: 60px;
            font-weight: bold;
            color: #333;
            margin: 20px 0;
            font-family: 'Comic Sans MS', sans-serif;
        }

        #result-comment {
            font-size: 24px;
            color: #666;
            margin-bottom: 30px;
            text-align: center;
        }
    </style>
</head>

<body>

    <canvas id="bg-canvas"></canvas>

    <div class="app-container">

        <div id="start-screen" class="screen active">
            <h1 class="title">Melody Visualizers</h1>
            <div class="start-menu">
                <div class="mode-block">
                    <span style="font-size: 20px; font-weight: bold;">自由創作</span>
                    <p style="margin:0; color:#666;">無限制生成</p>

                    <div style="width: 100%;">
                        <select id="question-count" class="sketch-select">
                            <option value="1">題數: 1題</option>
                            <option value="3">題數: 3題</option>
                            <option value="5">題數: 5題</option>

                        </select>
                        <select id="time-limit" class="sketch-select">
                            <option value="5">每題: 5秒</option>
                            <option value="10">每題: 10秒</option>
                            <option value="15">每題: 15秒</option>
                            <option value="20">每題: 20秒</option>

                </select>
                <label for="key">選擇調性 (Key):</label>
                <select id="key" class="sketch-select">
                    <option value="0">C</option>

                </select>
                <div style="display: flex; gap: 10px;">
                    <div style="flex:1;">

                <select id="note_duration" class="sketch-select">

                <div class="checkbox-group">

                            id="include_arpeggios"></div>

                            id="include_chords"></div>
                </div>
                <button class="generate-btn" id="gen-btn" onclick="startGenerationProcess()">開始生成 MIDI</button>
                <div id="download-area" style="display:none; margin-top:10px; text-align:center;">
                    <p>生成完成！</p>
                    <a id="midi-download-link" href="#" target="_blank" style="

                    <div class="key black" data-note="C#4" style="left: 38px;"></div>
                    <div class="key black" data-note="D#4" style="left: 92px;"></div>

                    <div class="key black" data-note="G#4" style="left: 254px;"></div>

    <script>
        // --- 動態背景邏輯 ---
        const canvas = document.getElementById('bg-canvas');
        const ctx = canvas.getContext('2d');
        let particles = [];

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }

        class Particle {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * 20 + 20;
                this.speedX = Math.random() * 0.5 - 0.25;
                this.speedY = Math.random() * 0.5 - 0.25;
                this.symbol = ['♪', '♫', '♩', '♬', '♭', '♯', '𝄞'][Math.floor(Math.random() * 7)];
                this.rotation = Math.random() * Math.PI * 2;
                this.rotationSpeed = Math.random() * 0.01 - 0.005;
            }
            update() {
                this.x += this.speedX;
                this.y += this.speedY;
                this.rotation += this.rotationSpeed;
                if (this.x > canvas.width + this.size) this.x = -this.size;
                if (this.x < -this.size) this.x = canvas.width + this.size;
                if (this.y > canvas.height + this.size) this.y = -this.size;
                if (this.y < -this.size) this.y = canvas.height + this.size;
            }
            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.rotation);
                ctx.font = `${this.size}px "Comic Neue", sans-serif`;
                ctx.fillStyle = 'rgba(0, 0, 0, 0.3)';
                ctx.fillText(this.symbol, -this.size / 2, this.size / 2);
                ctx.restore();
            }
        }

        function initBackground() {
            resizeCanvas();
            window.addEventListener('resize', resizeCanvas);
            for (let i = 0; i < 45; i++) {
                particles.push(new Particle());
            }
            animateBackground();
        }

        function animateBackground() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#f0f0f0';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            for (let p of particles) {
                p.update();
                p.draw();
            }
            requestAnimationFrame(animateBackground);
        }

        // --- 核心邏輯變數 ---
        let synth;
        let isAudioContextStarted = false;

        let timerInterval;
        let transitionInterval;
        let currentQuestion = 1;
        let totalQuestions = 1;
        let secondsPerQuestion = 10;
        let currentSeconds = 0;
        let currentTargetNote = "";
        let hasAnswered = false;
        let score = 0;

        const availableNotes = ["C4", "C#4", "D4", "D#4", "E4", "F4", "F#4", "G4", "G#4", "A4", "A#4", "B4", "C5", "C#5", "D5", "D#5", "E5"];

        // 唱名對照表 (用於結果顯示)
        const noteToSolfege = {
            "C4": "Do", "C#4": "Do#", "D4": "Re", "D#4": "Re#", "E4": "Mi",
            "F4": "Fa", "F#4": "Fa#", "G4": "Sol", "G#4": "Sol#", "A4": "La",
            "A#4": "La#", "B4": "Si",
            "C5": "Do↑", "C#5": "Do#↑", "D5": "Re↑", "D#5": "Re#↑", "E5": "Mi↑"
        };

        window.onload = function () {
            document.querySelectorAll('.key').forEach(key => {
                key.addEventListener('mousedown', () => {
                    const note = key.getAttribute('data-note');
                    handleKeyClick(key, note);
                });
            });

            initBackground();
        };

        
        async function startGenerationProcess() {
            // 1. 收集參數
            const params = {
                scale: document.getElementById('scale').value,
                key: document.getElementById('key').value,
                bars: document.getElementById('bars').value,
                tempo: document.getElementById('tempo').value,
                note_duration: document.getElementById('note_duration').value,
                octave: '0', // 若 UI 沒開放調整，設為預設
                include_arpeggios: document.getElementById('include_arpeggios').checked ? 'on' : null,
                include_rests: document.getElementById('include_rests').checked ? 'on' : null,
                include_chords: document.getElementById('include_chords').checked ? 'on' : null
            };

            // 2. 顯示 Loading
            goToScreen('loading-screen');
            const progressBar = document.getElementById('progress-bar');
            progressBar.style.width = '30%'; // 假進度

            try {
                // 3. 發送請求給 Node.js 後端
                const response = await fetch('http://localhost:3000/api/generate', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(params)
                });

                const data = await response.json();

                if (data.success) {
                    progressBar.style.width = '100%';
                    
                    // 延遲一下讓使用者看到 100%
                    setTimeout(() => {
                        goToScreen('main-screen');
                        
                        // 4. 顯示下載按鈕
                        const downloadArea = document.getElementById('download-area');
                        const downloadLink = document.getElementById('midi-download-link');
                        
                        downloadLink.href = data.midiUrl;
                        downloadLink.download = data.filename; // 建議瀏覽器存檔名
                        downloadArea.style.display = 'block';
                        
                        alert(`生成成功！請點擊下方按鈕下載。\n(檔案: ${data.filename})`);
                    }, 500);
                } else {
                    alert('生成失敗: ' + data.error);
                    goToScreen('main-screen');
                }

            } catch (error) {
                console.error('Error:', error);
                alert('無法連線到伺服器');
                goToScreen('main-screen');
            }
        }


        async function initAudio() {
            if (!isAudioContextStarted) {
                await Tone.start();
                synth = new Tone.Synth({
                    oscillator: { type: "triangle" },
                    envelope: { attack: 0.005, decay: 0.1, sustain: 0.3, release: 1 }
                }).toDestination();
                synth.volume.value = -5; // 統一音量
                isAudioContextStarted = true;
            }
        }

        function playCurrentNote() {
            if (synth && currentTargetNote) {
                synth.triggerRelease();
                synth.triggerAttackRelease(currentTargetNote, "8n", Tone.now() + 0.05, 1);
            }
        }

        function goToScreen(screenId) {
            stopTimer();
            if (transitionInterval) clearInterval(transitionInterval);

            document.querySelectorAll('.screen').forEach(screen => {
                screen.classList.remove('active');
            });
            document.getElementById(screenId).classList.add('active');
        }

        function toggleModal(show) {
            document.getElementById('instruction-modal').style.display = show ? 'flex' : 'none';
        }

        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            const openBtn = document.getElementById('open-sidebar-btn');
            if (sidebar.classList.contains('closed')) {
                sidebar.classList.remove('closed');
                openBtn.style.display = 'none';
            } else {
                sidebar.classList.add('closed');
                setTimeout(() => openBtn.style.display = 'block', 300);
            }
        }

        function startLoading() {
            goToScreen('loading-screen');
            const bar = document.getElementById('progress-bar');
            let width = 0;
            bar.style.width = '0%';
            const interval = setInterval(() => {
                if (width >= 100) {
                    clearInterval(interval);
                    goToScreen('main-screen');
                } else {
                    width += 2;
                    bar.style.width = width + '%';
                }
            }, 30);
        }

        // --- 測驗邏輯 ---

        async function startTest() {
            await initAudio();
            totalQuestions = parseInt(document.getElementById('question-count').value);
            secondsPerQuestion = parseInt(document.getElementById('time-limit').value);
            currentQuestion = 1;
            score = 0;

            goToScreen('test-screen');
            loadNewQuestion();
        }

        function loadNewQuestion() {
            hasAnswered = false;
            document.getElementById('transition-display').innerText = "";
            document.getElementById('next-q-btn').style.display = 'none';
            document.getElementById('piano').classList.remove('disabled');

            document.querySelectorAll('.key').forEach(k => {
                k.classList.remove('correct', 'wrong', 'active-visual');
            });

            document.getElementById('question-indicator').innerText = `Question ${currentQuestion} / ${totalQuestions}`;
            document.getElementById('live-score').innerText = `Score: ${score} / ${totalQuestions}`;

            const infoDisplay = document.getElementById('test-info-display');
            infoDisplay.innerText = "請聆聽...";
            infoDisplay.className = "feedback-neutral";

            currentTargetNote = availableNotes[Math.floor(Math.random() * availableNotes.length)];
            console.log("Answer:", currentTargetNote);

            setTimeout(() => {
                playCurrentNote();
                setTimeout(() => {
                    playCurrentNote();
                    resetAndStartTimer();
                }, 1250);
            }, 500);
        }

        function handleKeyClick(keyElement, note) {
            if (hasAnswered) return;

            hasAnswered = true;
            stopTimer();
            document.getElementById('piano').classList.add('disabled');

            keyElement.classList.add('active-visual');

            if (synth) {
                synth.triggerRelease();
                synth.triggerAttackRelease(note, "8n", Tone.now() + 0.05, 1);
            }

            const infoDisplay = document.getElementById('test-info-display');

            if (note === currentTargetNote) {
                score++;
                keyElement.classList.add('correct');
                infoDisplay.innerText = `Correct! It was ${noteToSolfege[currentTargetNote]}`;
                infoDisplay.className = "feedback-correct";
            } else {
                keyElement.classList.add('wrong');
                const correctKey = document.querySelector(`.key[data-note="${currentTargetNote}"]`);
                if (correctKey) correctKey.classList.add('correct');
                infoDisplay.innerText = `Wrong! Answer was ${noteToSolfege[currentTargetNote]}`;
                infoDisplay.className = "feedback-wrong";
            }

            document.getElementById('live-score').innerText = `Score: ${score} / ${totalQuestions}`;

            if (currentQuestion < totalQuestions) {
                document.getElementById('next-q-btn').style.display = 'inline-block';
            } else {
                document.getElementById('next-q-btn').style.display = 'none';
            }

            startTransitionTimer();
        }

        function nextQuestion() {
            if (transitionInterval) clearInterval(transitionInterval);

            if (currentQuestion < totalQuestions) {
                currentQuestion++;
                loadNewQuestion();
            } else {
                showResultModal();
            }
        }

        function endTest() {
            stopTimer();
            if (transitionInterval) clearInterval(transitionInterval);

            if (currentQuestion === totalQuestions && hasAnswered) {
                showResultModal();
            } else {
                if (confirm("確定要放棄測驗回到首頁嗎？")) {
                    goToScreen('start-screen');
                }
            }
        }

        function showResultModal() {
            stopTimer();
            if (transitionInterval) clearInterval(transitionInterval);

            const modal = document.getElementById('result-modal');
            const scoreDiv = document.getElementById('result-score');
            const commentDiv = document.getElementById('result-comment');

            scoreDiv.innerText = `Score: ${score} / ${totalQuestions}`;

            const percentage = (score / totalQuestions) * 100;
            let comment = "";

            if (percentage === 100) {
                comment = "絕對音感！太神啦！";
            } else if (percentage >= 80) {
                comment = "非常優秀，差一點點！";
            } else if (percentage >= 60) {
                comment = "還不錯，繼續保持！";
            } else if (percentage >= 40) {
                comment = "再接再厲！";
            } else {
                comment = "多聽多練，加油！";
            }

            commentDiv.innerText = comment;
            modal.style.display = 'flex';
        }

        function closeResultModal() {
            document.getElementById('result-modal').style.display = 'none';
            goToScreen('start-screen');
        }

        function stopTimer() {
            if (timerInterval) {
                clearInterval(timerInterval);
                timerInterval = null;
            }
        }

        function resetAndStartTimer() {
            stopTimer();
            currentSeconds = secondsPerQuestion;
            document.getElementById('timer-display').innerText = currentSeconds;

            timerInterval = setInterval(() => {
                currentSeconds--;
                document.getElementById('timer-display').innerText = currentSeconds;

                if (currentSeconds <= 0) {
                    stopTimer();
                    const infoDisplay = document.getElementById('test-info-display');
                    infoDisplay.innerText = `Time's Up! It was ${noteToSolfege[currentTargetNote]}`;
                    infoDisplay.className = "feedback-wrong";

                    document.getElementById('piano').classList.add('disabled');
                    hasAnswered = true;

                    const correctKey = document.querySelector(`.key[data-note="${currentTargetNote}"]`);
                    if (correctKey) correctKey.classList.add('correct');

                    if (currentQuestion < totalQuestions) {
                        document.getElementById('next-q-btn').style.display = 'inline-block';
                    } else {
                        document.getElementById('next-q-btn').style.display = 'none';
                    }

                    startTransitionTimer();
                }
            }, 1000);
        }

        function startTransitionTimer() {
            let transitionSeconds = 5;
            const display = document.getElementById('transition-display');

            if (currentQuestion < totalQuestions) {
                display.innerText = `Next question in ${transitionSeconds}...`;
            } else {
                display.innerText = `Showing results in ${transitionSeconds}...`;
            }

            if (transitionInterval) clearInterval(transitionInterval);

            transitionInterval = setInterval(() => {
                transitionSeconds--;
                if (currentQuestion < totalQuestions) {
                    display.innerText = `Next question in ${transitionSeconds}...`;
                } else {
                    display.innerText = `Showing results in ${transitionSeconds}...`;
                }

                if (transitionSeconds <= 0) {
                    clearInterval(transitionInterval);
                    nextQuestion();
                }
            }, 1000);
        }
    </script>
</body>

</html>
